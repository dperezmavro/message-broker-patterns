events {}

http {
    upstream rabbitmq_management {
        server rabbitmq-1:15672;
        server rabbitmq-2:15672;
        server rabbitmq-3:15672;
    }

    server {
        listen 15672 default_server;

        location / {
            proxy_pass http://rabbitmq_management;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

stream {
    upstream rabbitmq_amqp {
        least_conn;
        server rabbitmq-1:5672;
        server rabbitmq-2:5672;
        server rabbitmq-3:5672;
    }

    server {
        listen 5672;
        proxy_pass rabbitmq_amqp;
        proxy_timeout 3s;
        proxy_connect_timeout 3s;
    }
}
