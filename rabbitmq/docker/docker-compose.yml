services:
  nginx:
    depends_on:
      rabbitmq-1:
        condition: service_healthy
      rabbitmq-2:
        condition: service_healthy
      rabbitmq-3:
        condition: service_healthy
      # quorum_maker:
      #   condition: service_completed_successfully
    image: nginx:latest
    restart: unless-stopped
    container_name: nginx
    networks:
      - rabbitmq_network
    hostname: nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "5672:5672"
      - "15672:15672"
  
  rabbitmq-1:
    image: rabbitmq:4-management
    container_name: rabbitmq-1
    networks:
      - rabbitmq_network
    hostname: rabbitmq-node-1
    mem_limit: 256m
    # avoid exposing rabbitmq to the host
    ports:
      - "15692:15692"    # prometheus port
    #   - "5672:5672"      # AMQP protocol port
    #   - "15672:15672"    # Management UI port
    environment:
      # Custom admin credentials
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: secretpassword123
      RABBITMQ_DEFAULT_VHOST: default
      RABBITMQ_NODENAME: rabbitmq-node-1
      RABBITMQ_ERLANG_COOKIE: "unique-secret-cookie"
    volumes:
      - ./rabbitmq_data_1:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  rabbitmq-2:
    image: rabbitmq:4-management
    container_name: rabbitmq-2
    networks:
      - rabbitmq_network
    hostname: rabbitmq-node-2
    mem_limit: 256m
    # avoid exposing rabbitmq to the host
    ports:
      - "15693:15692"    # prometheus port
    #   - "5672:5672"      # AMQP protocol port
    #   - "15672:15672"    # Management UI port
    environment:
      # Custom admin credentials
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: secretpassword123
      RABBITMQ_DEFAULT_VHOST: default
      RABBITMQ_NODENAME: rabbitmq-node-2
      RABBITMQ_ERLANG_COOKIE: "unique-secret-cookie"
    volumes:
      - ./rabbitmq_data_2:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  rabbitmq-3:
    image: rabbitmq:4-management
    container_name: rabbitmq-3
    networks:
      - rabbitmq_network
    hostname: rabbitmq-node-3
    mem_limit: 256m
    # avoid exposing rabbitmq to the host
    ports:
      - "15694:15692"    # prometheus port
    #   - "5672:5672"      # AMQP protocol port
    #   - "15672:15672"    # Management UI port
    environment:
      # Custom admin credentials
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: secretpassword123
      RABBITMQ_DEFAULT_VHOST: default
      RABBITMQ_NODENAME: rabbitmq-node-3
      RABBITMQ_ERLANG_COOKIE: "unique-secret-cookie"
    volumes:
      - ./rabbitmq_data_3:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  prometheus:
    image: prom/prometheus
    profiles:
      - monitoring
    container_name: prometheus
    networks:
      - rabbitmq_network
    healthcheck:
      test: ["CMD", "wget", "-O-", "http://localhost:9090/-/ready"]
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - 9090:9090
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prom_data:/prometheus
  
  grafana:
    image: grafana/grafana
    container_name: grafana
    profiles:
      - monitoring
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - rabbitmq_network
    ports:
      - 3000:3000
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=grafana
    user: "472:0"
    volumes:
      - ./grafana_data/provisioning:/etc/grafana/provisioning
      - ./grafana_data/dashboards:/var/lib/grafana/dashboards
      - ./grafana_data/data:/var/lib/grafana

  # quorum_maker:
  #   depends_on:
  #     rabbitmq-1:
  #       condition: service_healthy
  #     rabbitmq-2:
  #       condition: service_healthy
  #     rabbitmq-3:
  #       condition: service_healthy
  #   image: rabbitmq:4-management
  #   command: bash /opt/make-quorum.sh
  #   environment:
  #     RABBITMQ_NODENAME: rabbitmq-quorum-maker
  #     RABBITMQ_ERLANG_COOKIE: "unique-secret-cookie"
  #   restart: on-failure
  #   container_name: quorum-maker
  #   networks:
  #     - rabbitmq_network
  #   hostname: quorum-maker
  #   volumes:
  #     - ./make-quorum.sh:/opt/make-quorum.sh:ro


networks:
  rabbitmq_network:
    driver: bridge


volumes:
  rabbitmq_data_1:
    driver: local
  rabbitmq_data_2:
    driver: local
  rabbitmq_data_3:
    driver: local
  prom_data:
    driver: local
