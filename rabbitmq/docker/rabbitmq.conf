# rabbitmq.conf - Main configuration file
# Place in ./rabbitmq.conf and mount to /etc/rabbitmq/rabbitmq.conf

# Networking - listen on all interfaces
listeners.tcp.default = 5672

# Management plugin configuration
management.tcp.port = 15672
management.tcp.ip = 0.0.0.0
vm_memory_high_watermark.relative = 0.7
disk_free_limit.absolute = 1GB

# Logging configuration
log.console = true
log.console.level = info

# Channel limits
# Maximum channels per connection (highest permissible value is 2047)
channel_max = 2047

# Heartbeat timeout (seconds) - detect dead connections
heartbeat = 10

# Consumer acknowledgement timeout (optional, in milliseconds)
# Disconnects a consumer that fails to ack within this window
cluster_queue_limit = 10000
consumer_timeout = 1800000
vhost_max = 100

# Static cluster formation - nodes discover each other from this list at startup
cluster_formation.peer_discovery_backend = rabbit_peer_discovery_classic_config
cluster_formation.classic_config.nodes.1 = rabbitmq-node-1@rabbitmq-node-1
cluster_formation.classic_config.nodes.2 = rabbitmq-node-2@rabbitmq-node-2
cluster_formation.classic_config.nodes.3 = rabbitmq-node-3@rabbitmq-node-3